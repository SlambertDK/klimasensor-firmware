; Klimasensor firmware
; Byg: pio run -e esp32   |   Unit-tests: pio test -e native

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DFW_VERSION=\"1.0.0\"
    -Isrc/core
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_src_filter = +<*>

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DNATIVE_BUILD
    -DFW_VERSION=\"1.0.0\"
    -Isrc/core
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_src_filter = +<core/>
test_build_src = yes
