; Klimasensor firmware
; Byg: pio run -e pico32 (eller -e esp32)   |   Unit-tests: pio test -e native

[platformio]
default_envs = pico32

; Fælles for alle ESP32-boards
[esp32_base]
platform = espressif32
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DFW_VERSION=\"1.0.0\"
    -Isrc/core
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_src_filter = +<*>

; ESP32-PICO-D4 (Pico32) — den faktiske hardware.
; NB: GPIO 6, 7, 8, 11, 16 og 17 er optaget af den indbyggede flash på
; PICO-D4 og må IKKE bruges til sensorer/modem (se include/board_pins.h).
[env:pico32]
extends = esp32_base
board = pico32

; Generisk ESP32-devkit (til test på andre boards)
[env:esp32]
extends = esp32_base
board = esp32dev

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DNATIVE_BUILD
    -DFW_VERSION=\"1.0.0\"
    -Isrc/core
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_src_filter = +<core/>
test_build_src = yes
